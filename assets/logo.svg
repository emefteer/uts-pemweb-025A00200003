  <path d="M 15.5 24.5 Q 17.5 22.5 20 24.5 T 24.5 24.5" stroke="#0284c7" stroke-width="1.8" stroke-linecap="round" />
  
  <!-- Sparkle Star Accent -->
  <path d="M 33 4 Q 33 7.5 29.5 7.5 Q 33 7.5 33 11 Q 33 7.5 36.5 7.5 Q 33 7.5 33 4 Z" fill="#38bdf8" />
