<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="100%" height="100%" fill="none">
  <!-- Rounded Background Container -->
  <rect width="40" height="40" rx="10" fill="#ffffff" />
  
  <!-- Mini Machine Outline -->
  <rect x="8" y="7" width="24" height="26" rx="4" stroke="#0077b6" stroke-width="2.2" fill="#f0f9ff" />
  <line x1="8" y1="13" x2="32" y2="13" stroke="#0077b6" stroke-width="1.8" />
  
  <!-- Knobs & Status Indicator -->
  <circle cx="12.5" cy="10" r="1.3" fill="#0284c7" />
  <circle cx="16.5" cy="10" r="1.3" fill="#0284c7" />
  <circle cx="27" cy="10" r="1.6" fill="#38bdf8" />
  
  <!-- Outer Porthole -->
  <circle cx="20" cy="23.5" r="7.5" fill="#e0f2fe" stroke="#cbd5e1" stroke-width="1" />
  <!-- Washing Drum Rim -->
  <circle cx="20" cy="23.5" r="6" stroke="#0077b6" stroke-width="2" fill="#ffffff" />
